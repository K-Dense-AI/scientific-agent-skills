# --- packages a skill documents that cannot be installed here -------------
#
# The runner prints these when it sets up the skill, so the gap is visible in
# the test output rather than rediscovered each time.

[unavailable]
qiime2-amplicon = "qiime2-amplicon skill: QIIME 2 2026.7 requires the full conda/container distribution including R and DADA2, rather than a pip installation. The portable helper suite is standard-library only."
relion = "relion skill: RELION 5.0.1 native C++ executables are not supplied by the pip test environment; the documented MPI workflows need a compatible MPI/OpenMP runtime and FFTW or MKL. Python validators are tested separately."
cellprofiler = "cellprofiler skill: CellProfiler 4.2.8 needs Java and native system dependencies. Real integration was tested in the official linux/amd64 Docker image; the portable helper suite needs NumPy and tifffile only."
mageck = "mageck skill: MAGeCK 0.5.9.5 requires a source or Bioconda installation with its compiled RRA binary. Put the executable on PATH to run real integration tests; the bundled validation helpers use only the standard library."
adaptyv-sdk = "adaptyv skill: distributed from GitHub only, not on PyPI"
tiledbvcf = "tiledbvcf skill: native tiledbvcf 0.40.3 is not on PyPI; install tiledb::tiledbvcf-py from the official TileDB Conda channel (osx-arm64/osx-64/linux-64, Python 3.9-3.12), or build source. Native tests run separately from uv."
matlabengine = "matlab skill: requires a local MATLAB installation to build against"
hypogenic = "hypogenic skill: pins torch<=2.4.1, which has no cp313 wheels"
pathml = "pathml skill: python-javabridge needs a JDK, plus OpenSlide and Bio-Formats"
omero-py = "omero-integration skill: zeroc-ice 3.6.5 has no wheels and needs a C++ build"
rsgislib = "geomaster skill: native RSGISLib stack via conda-forge/source, unavailable in uv-only test environment"
pdal = "geomaster skill: PyPI extension requires separately installed native PDAL library; conda-forge supported"
mpi4py = "fluidsim skill: needs a site MPI implementation and compilers"
"flash-attn" = "esm skill: needs a CUDA toolchain to build"
deepspeed = "pytorch-lightning skill: Lightning 2.6.6 DeepSpeedStrategy requires CUDA GPUs unavailable on the macOS audit host; optional compiled ops require platform-specific toolchains. A pip installation does not always require CUDA compilation."
"cudf-cu12" = "optimize-for-gpu skill: RAPIDS runtime requires supported Linux x86_64/aarch64 or WSL2 plus NVIDIA CUDA; unavailable on the macOS audit host. CPU algorithm tests use NumPy; Warp separately provides a macOS CPU wheel."
